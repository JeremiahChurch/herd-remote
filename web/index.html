<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>herd-remote</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3140;
    --fg:#e6edf3; --muted:#8b949e;
    /* status palette mirrors herdr: green idle, orange working, red blocked */
    --idle:#3fb950; --working:#f0883e; --blocked:#f85149; --done:#6e7681; --unknown:#d29922;
    --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;overflow:hidden}
  header{flex:none;background:var(--panel);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sp{flex:1}
  button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .btn-accent{background:var(--accent);color:#04121f;border-color:transparent;font-weight:600}
  .btn-codex{background:#8957e5;color:#fff;border-color:transparent;font-weight:600}
  .btn-hermes{background:#0f9b8e;color:#fff;border-color:transparent;font-weight:600}
  .seg{display:flex;gap:6px;padding:8px 12px 0}
  .seg button{flex:1;padding:7px 0;font-size:13px}
  .seg button.on{background:var(--accent);color:#04121f;border-color:transparent;font-weight:600}
  .seg button.on.codex{background:#8957e5;color:#fff}
  .seg button.on.hermes{background:#0f9b8e;color:#fff}
  /* each top-level view is a full-height flex column */
  .view{position:absolute;inset:0;display:flex;flex-direction:column}
  /* .hidden must be generic: #scrollText (the copy-mode textarea) carries it too, and
     without a rule it rendered as a full-height blank block under the scrollback. */
  .hidden{display:none}
  .view.hidden{display:none}
  .scrollwrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:760px;margin:0 auto;width:100%;padding:12px 12px calc(env(safe-area-inset-bottom) + 24px)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .card:active{background:var(--panel2)}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.03)}
  .idle{background:var(--idle)} .working{background:var(--working)}
  .blocked{background:var(--blocked);animation:pulse 1s infinite}
  .done{background:var(--done)} .unknown{background:var(--unknown)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .meta{flex:1;min-width:0}
  .meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  /* status-tinted badges (list + detail) so state reads at a glance, herdr-style */
  .badge.st-idle{color:var(--idle);border-color:var(--idle)}
  .badge.st-working{color:var(--working);border-color:var(--working)}
  .badge.st-blocked{color:var(--blocked);border-color:var(--blocked)}
  .badge.st-done{color:var(--done);border-color:var(--done)}
  .badge.st-unknown{color:var(--unknown);border-color:var(--unknown)}
  .agentTag{font-size:10px;color:var(--muted)}
  /* sessions on a saved herdr machine (Shop PC etc.) carry its label; local ones carry none */
  .machTag{font-size:10px;color:#e3b341;border:1px solid #6b5517;border-radius:6px;padding:1px 5px;
    margin-right:4px;white-space:nowrap}
  .machWarn{color:var(--unknown);font-size:12px;margin:0 2px 10px}
  /* resume: age pinned to a fixed left column so it never gets pushed off by a long path */
  .card .age{flex:none;width:46px;font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;text-align:left}
  .pid{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);font-weight:400}

  /* detail: scrollback fills, controls pinned to the bottom */
  #dScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
    background:#010409;margin:10px 10px 0;border:1px solid var(--line);border-radius:12px}
  #scroll{padding:12px;margin:0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;min-height:100%}
  /* Copy on a phone: keep "Select All" scoped to the terminal scrollback only, so
     it grabs the screen text - not the header, status badges, or control buttons. */
  header,.metabar,.controls,.card .badge,.agentTag,.pid{-webkit-user-select:none;user-select:none}
  #scroll{-webkit-user-select:text;user-select:text;cursor:text}
  /* copy mode: a plain readonly textarea with native, well-behaved mobile selection.
     Polling is paused while it's showing, so nothing shifts under your finger. */
  #scrollText{width:100%;height:100%;box-sizing:border-box;border:0;resize:none;outline:none;
    padding:12px;margin:0;background:#010409;color:var(--fg);
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
  .controls textarea{-webkit-user-select:text;user-select:text}
  #copyBtn{padding:5px 9px;font-size:12px;border-radius:8px}
  #copyBtn.on{background:var(--accent);color:#04121f;border-color:transparent;font-weight:600}
  .controls{flex:none;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background:var(--panel);border-top:1px solid var(--line)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .promptbar{display:flex;gap:8px;margin:8px 0 0}
  .promptbar textarea{flex:1;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:10px;padding:10px;font:inherit;resize:none}
  .metabar{display:flex;gap:8px;align-items:center;padding:6px 10px 0}
  .list-input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:12px;margin-bottom:10px}
  label.fld{display:block;color:var(--muted);font-size:12px;margin:12px 0 4px}
  .danger{color:var(--blocked);border-color:var(--blocked)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
    z-index:20;opacity:0;transition:opacity .2s;max-width:90%;pointer-events:none}
  .toast.show{opacity:1}
  .center{max-width:360px;margin:16vh auto 0;padding:0 20px;text-align:center}
  .center input{width:100%;text-align:center;font-size:18px;margin:16px 0}
  #listView header{flex-wrap:wrap;gap:6px}
  #listView header h1{flex:1 1 100%}
  #listView header .sp{display:none}
  #listView header button{font-size:13px;padding:9px 10px}
  .msgMachine{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
  .msgMachine h2{font-size:17px}.msgMachine h3{font-size:15px}
  .msgCounts,.msgWrap{overflow-wrap:anywhere;font-size:12px}
  .msgControls{display:flex;gap:8px;flex-wrap:wrap}
  .msgRow{width:100%;text-align:left}.msgRow .meta>span{display:block}
  .msgRow .badge{max-width:100px;overflow-wrap:anywhere;white-space:normal}
  .msgSession{border-top:1px solid var(--line);padding:8px 0}
  .msgPre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}
  button:disabled{opacity:.5;cursor:default}
  .spawnRow{display:flex;gap:8px}
  .spawnRow button{flex:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="view hidden"><div class="scrollwrap"><div class="center">
  <h1>herd-remote</h1>
  <p style="color:var(--muted)">Enter access password</p>
  <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="password">
  <button class="btn-accent" style="width:100%" onclick="doLogin()">Unlock</button>
  <p id="loginErr" style="color:var(--blocked)"></p>
</div></div></div>

<!-- LIST -->
<div id="listView" class="view hidden">
  <header>
    <h1>Sessions</h1><span class="sp"></span>
    <button onclick="showMessages()">Messages <span id="msgBadge" class="badge">?</span></button>
    <button onclick="showResume()">↩ Resume</button>
    <button onclick="showSpawn()">＋ Spawn</button>
    <button onclick="refresh()">↻</button>
  </header>
  <div class="scrollwrap"><div class="wrap" id="cards"></div></div>
</div>

<!-- DETAIL -->
<div id="detailView" class="view hidden">
  <header>
    <button onclick="backToList()">‹</button>
    <h1 id="dTitle">session</h1><span class="sp"></span>
    <button onclick="renameCur()">✎</button>
  </header>
  <div class="metabar">
    <span class="machTag hidden" id="dMachine"></span>
    <span class="badge" id="dAgent"></span>
    <span class="pid" id="dPane"></span>
    <span class="badge" id="dStatus"></span>
    <span class="sp"></span>
    <button id="copyBtn" onclick="toggleCopy()">⧉ Copy</button>
    <label style="color:var(--muted);font-size:12px"><input type="checkbox" id="auto" checked> auto</label>
  </div>
  <div id="dScroll"><pre id="scroll">loading…</pre><textarea id="scrollText" class="hidden" readonly></textarea></div>

  <div class="controls">
    <div class="grid4">
      <button class="btn-accent" onclick="key('Enter')">✔ Enter</button>
      <button onclick="key('Escape')">✕ Esc</button>
      <button onclick="key('C-c')">⎉ C-c</button>
      <button onclick="key('Backspace')">⌫ Bksp</button>
    </div>
    <div class="grid4">
      <button onclick="key('Left')">◀</button>
      <button onclick="key('Up')">▲</button>
      <button onclick="key('Down')">▼</button>
      <button onclick="key('Right')">▶</button>
    </div>
    <div class="grid4">
      <button onclick="key('y')">y</button>
      <button onclick="key('n')">n</button>
      <button onclick="key('1')">1</button>
      <button onclick="key('2')">2</button>
    </div>
    <div class="grid4">
      <button onclick="key('3')">3</button>
      <button onclick="key('4')">4</button>
      <button onclick="key('5')">5</button>
      <button onclick="closeSession()" class="danger">✕ kill</button>
    </div>
    <!-- Options are built in JS (renderCmdMenu) because the effort group differs per agent. -->
    <select id="cmdSel" class="list-input" style="margin:0 0 8px" onchange="runCmd(this)"></select>
    <div class="promptbar">
      <textarea id="prompt" rows="2" placeholder="type a prompt…"></textarea>
      <!-- Queue is hermes-only (shown by renderDetail): it wraps the text in /queue, which
           hands hermes the prompt for its NEXT turn instead of interrupting the current one.
           Claude and Codex queue typed input on their own, so they get no button. -->
      <button id="queueBtn" class="btn-hermes hidden" onclick="queuePrompt()">Queue</button>
      <button class="btn-accent" onclick="sendPrompt()">Send</button>
    </div>
  </div>
</div>

<!-- SPAWN -->
<div id="spawnView" class="view hidden">
  <header>
    <button onclick="backToList()">‹</button>
    <h1>Spawn</h1>
  </header>
  <div class="scrollwrap"><div class="wrap">
    <div id="machineRow" class="hidden">
      <label class="fld">Machine</label>
      <div class="seg" id="machineSeg" style="padding:0"></div>
    </div>
    <label class="fld">Session name (optional; labels the herdr window + this list)</label>
    <input id="spawnName" class="list-input" placeholder="e.g. failing-simplemdm-test"
      autocapitalize="off" autocomplete="off" spellcheck="false">
    <label class="fld">Folder — pick below, or type any path (even hidden, e.g. ~/.ssh)</label>
    <input id="folderFilter" class="list-input" placeholder="type a path or filter…"
      oninput="renderFolders()" autocapitalize="off" autocomplete="off" spellcheck="false">
    <select id="folder" class="list-input" size="8" style="height:auto"
      onchange="$('folderFilter').value=this.options[this.selectedIndex].textContent"></select>
    <label class="fld">First prompt (optional)</label>
    <textarea id="spawnPrompt" class="list-input" rows="3" placeholder="what should it do?"></textarea>
    <label class="fld">Model (picks the agent too — Claude, then Codex, then Hermes)</label>
    <select id="spawnModel" class="list-input" onchange="updateLaunchBtn()">
      <optgroup label="Claude">
        <!-- Claude Code aliases: each always resolves to the newest model in that family,
             so these never need a version bump. -->
        <option data-agent="claude" data-model="opus"   >Opus (latest)</option>
        <option data-agent="claude" data-model="sonnet" >Sonnet (latest)</option>
        <option data-agent="claude" data-model="fable"  >Fable (latest)</option>
        <option data-agent="claude" data-model="haiku"  >Haiku (latest)</option>
      </optgroup>
      <optgroup label="Codex" id="codexGroup">
        <!-- Rebuilt from /api/models (codex's own model cache) by loadModels(). -->
        <option data-agent="codex" data-model="">Codex · config default</option>
      </optgroup>
      <optgroup label="Hermes">
        <!-- No model/effort: hermes reads both from ~/.hermes/config.yaml, and changes
             them in-session with /model and /reasoning. One entry, nothing to drift. -->
        <option data-agent="hermes" data-model="">Hermes</option>
      </optgroup>
    </select>
    <div id="effortRow" class="hidden">
      <label class="fld">Reasoning effort</label>
      <select id="spawnEffort" class="list-input" onchange="updateLaunchBtn()"></select>
    </div>
    <button class="btn-accent" id="launchBtn" style="width:100%" onclick="doSpawn()">Launch</button>
    <p id="spawnMsg" style="color:var(--muted)"></p>
  </div></div>
</div>

<!-- RESUME -->
<div id="resumeView" class="view hidden">
  <header>
    <button onclick="backToList()">‹</button>
    <h1>Resume</h1><span class="sp"></span>
    <button onclick="renderResume()">↻</button>
  </header>
  <div class="seg">
    <button id="haAll" class="on" onclick="setHistAgent('all')">All</button>
    <button id="haClaude" onclick="setHistAgent('claude')">Claude</button>
    <button id="haCodex" onclick="setHistAgent('codex')">Codex</button>
    <button id="haHermes" onclick="setHistAgent('hermes')">Hermes</button>
  </div>
  <div style="padding:10px 12px 0"><input id="histFilter" class="list-input" style="margin:0"
    placeholder="filter by folder or name…" oninput="filterHistory()"
    autocapitalize="off" autocomplete="off" spellcheck="false"></div>
  <div class="scrollwrap"><div class="wrap" id="histCards"></div></div>
</div>

<!-- MESSAGES -->
<div id="messagesView" class="view hidden">
  <header><button onclick="backToList()" aria-label="Back to sessions">‹</button><h1>Messages</h1><span class="sp"></span>
    <button onclick="refreshMessages()" aria-label="Refresh messages">↻</button></header>
  <div class="seg">
    <button id="mf-queued" class="on" onclick="setMessageFilter('queued')">Queued</button>
    <button id="mf-held" onclick="setMessageFilter('held')">Held</button>
    <button id="mf-stuck" onclick="setMessageFilter('stuck')">Stuck</button>
    <button id="mf-all" onclick="setMessageFilter('all')">All</button>
  </div>
  <div class="scrollwrap"><div class="wrap"><p id="msgNotice" class="machWarn" role="status"></p><div id="msgCards"></div></div></div>
</div>
<div id="messageDetailView" class="view hidden">
  <header><button onclick="history.back()" aria-label="Back to messages">‹</button><h1 id="messageTitle">Message</h1><span class="sp"></span>
    <button onclick="refreshMessages()" aria-label="Refresh message">↻</button></header>
  <div class="scrollwrap"><div class="wrap">
    <p id="messageError" class="machWarn msgWrap" role="status"></p>
    <h2>Body</h2><pre id="messageBody" class="msgPre"></pre>
    <h2>Envelope</h2><pre id="messageEnvelope" class="msgPre"></pre>
    <h2>Attempts</h2><pre id="messageAttempts" class="msgPre"></pre>
    <h2>State history</h2><pre id="messageHistory" class="msgPre"></pre>
  </div></div>
  <div id="messageActions" class="controls msgControls"></div>
</div>

<div id="toast" class="toast"></div>

<script>
let cur=null, folders=[], pollTimer=null, refreshLoop=null, reading=false, copyMode=false, lastText='';
// Has the open session painted real scrollback yet? Distinguishes "first read hasn't
// landed" from "a later poll blipped", so a transient failure never wipes good output.
let painted=false;
const STATUSES=['idle','working','blocked','done','unknown'];
const $=id=>document.getElementById(id);
function show(view){if(!['messagesView','messageDetailView'].includes(view))stopMessagePoll();for(const v of ['login','listView','detailView','spawnView','resumeView','messagesView','messageDetailView'])$(v).classList.add('hidden');$(view).classList.remove('hidden');}
let toastTimer=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),m.length>40?4000:1600);}
function escHtml(s){return(s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

// Every request carries an abort timeout. Without one, a fetch that a phone leaves
// in limbo (Safari suspends the page on lock, and the pending request may never settle
// or reject) hangs forever - which wedges readScroll's `reading` guard and parks the
// scrollback on "loading…" until a manual reload.
const API_TIMEOUT_MS=15000;
async function api(path,opts){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),API_TIMEOUT_MS);
  try{
    const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'},signal:ac.signal},opts||{}));
    if(r.status===401){stopPoll();cur=null;show('login');throw new Error('unauth');}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(j.error||('http '+r.status));e.status=r.status;throw e;}
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('request timed out');
    throw e;
  }finally{clearTimeout(tm);}
}

// Pane and workspace ids are per herdr server, so every session call names its machine
// ("" = this box). sessURL builds /api/sessions/{id}/{action} with that attached.
function sessURL(s,id,action,query){
  const q=new URLSearchParams(query||{});if(s&&s.machine)q.set('machine',s.machine);
  const qs=q.toString();
  return `/api/sessions/${encodeURIComponent(id)}/${action}`+(qs?'?'+qs:'');}
function sameSess(a,b){return !!a&&!!b&&a.pane_id===b.pane_id&&(a.machine||'')===(b.machine||'');}

// ---------- ANSI -> HTML (basic SGR: 16 colors + 256 + truecolor, bold/underline/inverse) ----------
const ANSI_FG={30:'#484f58',31:'#ff7b72',32:'#3fb950',33:'#d29922',34:'#58a6ff',35:'#bc8cff',36:'#39c5cf',37:'#b1bac4',
  90:'#6e7681',91:'#ffa198',92:'#56d364',93:'#e3b341',94:'#79c0ff',95:'#d2a8ff',96:'#56d4dd',97:'#f0f6fc'};
const ANSI_BG={40:'#010409',41:'#ff7b72',42:'#3fb950',43:'#d29922',44:'#58a6ff',45:'#bc8cff',46:'#39c5cf',47:'#b1bac4',
  100:'#6e7681',101:'#ffa198',102:'#56d364',103:'#e3b341',104:'#79c0ff',105:'#d2a8ff',106:'#56d4dd',107:'#f0f6fc'};
function xterm256(n){
  if(n<8)return ANSI_FG[30+n]; if(n<16)return ANSI_FG[90+(n-8)];
  if(n>=232){const v=8+(n-232)*10;return `rgb(${v},${v},${v})`;}
  n-=16;const r=Math.floor(n/36),g=Math.floor((n%36)/6),b=n%6;const c=v=>v?55+v*40:0;
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
function ansiToHtml(s){
  s=s.replace(/\r\n/g,'\n').replace(/\r/g,'');
  let out='',cur='',i=0,fg=null,bg=null,bold=false,ul=false,inv=false;
  const open=()=>{let f=fg,b=bg;if(inv){const t=f;f=b||'#0d1117';b=t||'#e6edf3';}
    let st='';if(f)st+='color:'+f+';';if(b)st+='background:'+b+';';if(bold)st+='font-weight:600;';if(ul)st+='text-decoration:underline;';
    return st?'<span style="'+st+'">':'<span>';};
  const flush=()=>{if(cur){out+=open()+escHtml(cur)+'</span>';cur='';}};
  const sgr=p=>{const codes=(p===''?'0':p).split(';').map(Number);
    for(let k=0;k<codes.length;k++){const n=codes[k];
      if(n===0){fg=bg=null;bold=ul=inv=false;}
      else if(n===1)bold=true;else if(n===22)bold=false;
      else if(n===4)ul=true;else if(n===24)ul=false;
      else if(n===7)inv=true;else if(n===27)inv=false;
      else if(n===39)fg=null;else if(n===49)bg=null;
      else if(ANSI_FG[n])fg=ANSI_FG[n];else if(ANSI_BG[n])bg=ANSI_BG[n];
      else if(n===38&&codes[k+1]===5){fg=xterm256(codes[k+2]);k+=2;}
      else if(n===48&&codes[k+1]===5){bg=xterm256(codes[k+2]);k+=2;}
      else if(n===38&&codes[k+1]===2){fg=`rgb(${codes[k+2]},${codes[k+3]},${codes[k+4]})`;k+=4;}
      else if(n===48&&codes[k+1]===2){bg=`rgb(${codes[k+2]},${codes[k+3]},${codes[k+4]})`;k+=4;}
    }};
  while(i<s.length){const c=s[i];
    if(c==='\x1b'&&s[i+1]==='['){let j=i+2;while(j<s.length&&!/[A-Za-z]/.test(s[j]))j++;
      if(s[j]==='m'){flush();sgr(s.slice(i+2,j));}i=j+1;continue;}
    if(c==='\x1b'){i+=2;continue;}
    cur+=c;i++;}
  flush();return out;
}

function ansiStrip(s){return(s||'')
  .replace(/\x1B\[[0-9;?]*[ -\/]*[@-~]/g,'')  // CSI (color/cursor) sequences
  .replace(/\x1B[@-Z\\-_]/g,'')               // other escapes (OSC intros etc.)
  .replace(/\r\n/g,'\n').replace(/\r/g,'');}
// The agent input box draws full-width horizontal rules (─── / ━━━ / ═══, 100+ chars).
// On a phone those wrap into many visual lines, so the prompt scrolls off-screen. Collapse
// each long rule run to a short divider so the box stays ~2 lines. Display-only; the run
// stays inside its original ANSI color span, so the divider keeps its color.
function collapseRules(s){return(s||'')
  .replace(/[─━┄┅┈┉╌╍═—―]{12,}/g,'─'.repeat(24))
  .replace(/[-_=]{24,}/g,m=>m[0].repeat(24));}
// tidyScreen trims what a terminal pads but a phone shouldn't show. Codex 0.166 shades its
// composer by padding every line to full terminal width (~140 spaces inside a background
// color), and in full-screen mode it fills the space between output and composer with
// blank rows. On a phone the padding wraps into screens of empty gray lines. So: drop
// trailing spaces (and the color codes wrapped around them) on each line, shrink a gap of
// 20+ spaces after text (the footer right-aligns its warning count) to 3, keep at most one
// blank line in a row, and drop trailing blank lines. A reset replaces any stripped color
// code so a style never bleeds into the next line.
function tidyScreen(s){
  const lines=(s||'').replace(/\r\n/g,'\n').replace(/\r/g,'').split('\n')
    .map(l=>l.replace(/(?:[ \t\u00a0]|\x1b\[[0-9;:]*m)+$/,m=>m.includes('\x1b')?'\x1b[0m':'')
      .replace(/(\S) {20,}/g,'$1   '));
  const out=[];let blank=0;
  for(const l of lines){
    if(!ansiStrip(l).trim()){if(++blank>1)continue;}else blank=0;
    out.push(l);}
  while(out.length&&!ansiStrip(out[out.length-1]).trim())out.pop();
  return out.join('\n');}
// Copy mode: freeze the scrollback into a readonly textarea (native mobile selection),
// pause polling so nothing moves under your finger. Toggle back to the live colored view.
let copyReturnTop=0; // scrollback offset to restore when leaving copy mode
function toggleCopy(){
  copyMode=!copyMode;
  const pre=$('scroll'),ta=$('scrollText'),btn=$('copyBtn'),box=$('dScroll');
  if(copyMode){
    // Hiding the <pre> collapses the box's scrollHeight, so stash where we were first.
    copyReturnTop=box.scrollTop;
    ta.value=ansiStrip(lastText);pre.classList.add('hidden');ta.classList.remove('hidden');
    ta.scrollTop=ta.scrollHeight; // newest output, same as the live view
    btn.textContent='✓ Done';btn.classList.add('on');
  }else{
    ta.classList.add('hidden');pre.classList.remove('hidden');
    btn.textContent='⧉ Copy';btn.classList.remove('on');
    box.scrollTop=copyReturnTop;readScroll();
  }
}
// force=true pins to the bottom no matter where the box was scrolled - used when opening a
// session, where the newest output is always what you want. Otherwise we only auto-follow if
// you were already parked at the bottom, so scrolling back through history isn't yanked away.
async function readScroll(force){
  if(!cur||reading||copyMode)return;
  const pane=cur.pane_id,me=cur;reading=true;
  try{
    const j=await api(sessURL(me,pane,'read',{lines:200}));
    if(!sameSess(cur,me))return; // navigated away mid-request
    lastText=tidyScreen(j.text||'');
    const box=$('dScroll'),atBottom=force||box.scrollHeight-box.scrollTop-box.clientHeight<40;
    $('scroll').innerHTML=lastText?ansiToHtml(collapseRules(lastText))
      :'<span style="color:var(--muted)">(pane has produced no output yet)</span>';
    painted=true;
    if(atBottom){
      box.scrollTop=box.scrollHeight;
      // Long lines re-wrap after layout settles on a phone, which changes scrollHeight
      // under us; re-pin on the next frame so we still land on the last line.
      requestAnimationFrame(()=>{if(sameSess(cur,me))box.scrollTop=box.scrollHeight;});
    }
  }catch(e){
    // Never sit on the "loading…" placeholder with no explanation: if the FIRST read for
    // this session failed there is nothing else on screen to go on, so show why. Later
    // failures are left alone - polling retries, and a blip shouldn't wipe good scrollback.
    if(sameSess(cur,me)&&!painted)
      $('scroll').textContent='read failed: '+e.message+'\n\nretrying…';
  }finally{reading=false;}
}

// Contents of the command/key picker. The effort group is agent-specific: Claude takes
// `/effort <level>` as a one-shot command, but Codex has no equivalent - it only exposes
// model + reasoning effort through the interactive /model picker, which you then drive
// with the arrow buttons and Enter.
// Deliberately absent: Shift+Tab (cycle permission mode). herdr's send-keys accepts the
// name but emits a plain \t, and it delivers every key as its own write - so neither
// "Shift+Tab" nor a manual Escape,[,Z lands as the contiguous CSI Z that Claude Code

// BackTab or raw bytes.

// phone: /quit, and /stop + /ps for the background terminals an interrupted turn leaves
// running. Its keys: F2 opens the warnings panel, Ctrl+t the transcript pager (q closes).
// Hermes names most of these differently (/compress, not /compact) and adds the two that
// matter when it is mid-turn: /queue hands it a prompt for the next turn, /steer slips one
// in after the current tool call. Neither interrupts, which is the whole point on a phone.
const CMD_MENU={

    hermes:[['/queue','/queue · usage (or use the Queue button)'],
            ['/steer','/steer · nudge after the next tool call'],
            ['/busy queue','/busy queue · Enter queues while busy'],
            ['/clear','/clear · new session'],['/compress','/compress · compact context'],
            ['/status','/status'],['/context','/context'],['/usage','/usage']],
  },
  effort:{
    claude:[['/effort auto','auto · model default'],['/effort low','low'],
            ['/effort medium','medium'],['/effort high','high'],
            ['/effort xhigh','xhigh'],['/effort max','max']],
    codex:[['/model','/model · pick model + effort'],['/fast','/fast · toggle 2x speed'],
           ['/plan','/plan · Plan mode']],
    hermes:[['/reasoning low','low'],['/reasoning medium','medium'],
            ['/reasoning high','high'],['/reasoning xhigh','xhigh'],
            ['/reasoning max','max'],['/model','/model · switch model']],
  },
  keys:{
    default:[['Space','Space'],['Tab','Tab']],
    codex:[['Space','Space'],['Tab','Tab'],['F2','F2 · warnings'],
           ['Ctrl+t','Ctrl+T · transcript'],['q','q · close transcript']],

// Rebuilt on every detail open: optgroup hiding is unreliable in mobile select pickers,
// so the wrong agent's effort options are never emitted rather than merely hidden.
function renderCmdMenu(agent){
  const opt=(kind,v,l)=>`<option data-kind="${kind}" value="${escHtml(v)}">${escHtml(l)}</option>`;
  const grp=(label,items,kind)=>`<optgroup label="${label}">`+
    items.map(([v,l])=>opt(kind,v,l)).join('')+'</optgroup>';
  const eff=CMD_MENU.effort[agent]||CMD_MENU.effort.claude;
  $('cmdSel').innerHTML='<option value="">⌘ command / key…</option>'
    +grp('slash',CMD_MENU.slash[agent]||CMD_MENU.slash.default,'cmd')

    +grp('keys',CMD_MENU.keys[agent]||CMD_MENU.keys.default,'key');

// runCmd dispatches the command/key select: 'key' items reuse the allowlisted send-keys
// path; 'cmd' items are typed as a slash-command prompt (text + Enter). Snaps back to the
// header label after each run so the picker is a fire-and-reset control, not a mode.
async function runCmd(sel){
  const o=sel.options[sel.selectedIndex],kind=o.dataset.kind,val=o.value;
  sel.selectedIndex=0;
  if(!val||!cur)return;
  if(kind==='key')return key(val);
  if(val==='/clear')return clearSession();   // keeps the destructive-action confirm
  if(val==='/quit')return quitSession();
  try{await api(sessURL(cur,cur.pane_id,'prompt'),{method:'POST',body:JSON.stringify({text:val})});
    toast(val);setTimeout(readScroll,400);}
  catch(e){toast(e.message);}}

function agoShort(sec){if(!sec)return'';let s=Math.floor(Date.now()/1000)-sec;if(s<0)s=0;

  // Search the name AND the full folder path (substring, so "exam" hits "name-example"),
  // matching the folder-picker's path search. shortCwd is folded in so "~/foo" queries hit too.
  const items=histList.filter(e=>(histAgent==='all'||e.agent===histAgent)&&
    (!q||((e.name||'')+' '+(e.cwd||'')+' '+shortCwd(e.cwd)+' '+e.agent).toLowerCase().includes(q)));
  if(!items.length){c.innerHTML='<div class="empty">no matching sessions</div>';return;}
  for(const e of items){
    const d=document.createElement('div');d.className='card';d.onclick=()=>resumeSession(e);
    const tint=AGENT_TAG_TINT[e.agent];
    const tag=`<span class="agentTag"${tint?` style="color:${tint}"`:''}>${escHtml(e.agent)}</span>`;
    const where=shortCwd(e.cwd);
    d.innerHTML=`<div class="age">${escHtml(agoShort(e.modified))}</div>
      <div class="meta"><div class="t">${escHtml(e.name||'(untitled)')}</div>
      <div class="s">${escHtml(where||'~')}</div></div>
      <div style="text-align:right">${tag}</div>`;
    c.appendChild(d);
  }
}
async function resumeSession(e){
  if(!confirm(`Resume ${e.agent}: ${e.name||e.id}?`))return;
  // Resume in the session's own folder: a worktree session resumed from ~ runs its
  // commands in the wrong place. '~' only if the store didn't record one.
  const dir=e.cwd||'~';
  try{const j=await api('/api/spawn',{method:'POST',body:JSON.stringify({
    dir,agent:e.agent,name:e.name||'',resume:e.id,background:true})});
    toast('resuming…');
    if(j.pane_id){ // jump into the resumed session
      const s={workspace_id:j.workspace_id,pane_id:j.pane_id,agent:e.agent,
        label:e.name||e.id,name:'',status:'working',cwd:dir};
      history.replaceState({view:'detail',s},'');renderDetail(s);
    }else{setTimeout(backToList,800);}
  }catch(err){toast(err.message);}}

// ---------- messages ----------
let messageMachines=[],messageFilter='queued',messageTimer=null,messageEpoch=0,messageBusy=false,messageStale=false;
const messageURL=(machine,id)=>`/api/messages/${encodeURIComponent(machine)}/${encodeURIComponent(id)}`;
function stopMessagePoll(){clearInterval(messageTimer);messageTimer=null;messageEpoch++;messageBusy=false;}
function showMessages(){navTo({view:'messages'});}
function renderMessages(){stopPoll();show('messagesView');startMessagePoll();}
function startMessagePoll(){stopMessagePoll();refreshMessages();messageTimer=setInterval(()=>{
  if(document.visibilityState==='visible')refreshMessages();},4000);}
function messageBadge(rows){
  const count=rows.reduce((n,m)=>n+(m.status?(m.status.counts.indeterminate||0)+(m.status.counts.dead||0):0),0);
  const partial=rows.some(m=>m.error);
  $('msgBadge').textContent=String(count)+(partial?'+':'');
  $('msgBadge').title=partial?'Some machines unavailable; count is incomplete':'Stuck messages';
}
async function refreshMessageBadge(){try{const j=await api('/api/messages');messageBadge(j.machines||[]);}catch(e){$('msgBadge').textContent='?';}}
async function refreshMessages(){
  if(messageBusy)return;
  const epoch=messageEpoch;messageBusy=true;
  try{
    const j=await api('/api/messages');if(epoch!==messageEpoch)return;
    messageMachines=j.machines||[];messageStale=false;messageBadge(messageMachines);paintMessages();
    if(history.state?.view==='message')await loadMessageDetail(epoch);
  }catch(e){if(epoch!==messageEpoch||e.message==='unauth')return;
    messageStale=true;paintMessages();$('msgNotice').textContent='List could not refresh: '+e.message;
    if(history.state?.view==='message'){$('messageActions').replaceChildren();toast(e.message);}
  }finally{if(epoch===messageEpoch)messageBusy=false;}
}
function setMessageFilter(value){messageFilter=value;paintMessages();}
function messageButton(label,action,danger=false){const b=document.createElement('button');b.textContent=label;
  if(danger)b.className='danger';b.disabled=messageStale;b.onclick=action;return b;}
function messageText(parent,tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.appendChild(e);return e;}
function paintMessages(){
  const c=$('msgCards');c.replaceChildren();$('msgNotice').textContent=messageStale?'List is stale. Refresh before using controls.':'';
  for(const v of ['queued','held','stuck','all'])$('mf-'+v).classList.toggle('on',v===messageFilter);
  for(const machine of messageMachines){
    const section=document.createElement('section');section.className='msgMachine';c.appendChild(section);
    messageText(section,'h2',machine.label);
    if(machine.error){
      messageText(section,'p',machine.problem==='not_installed'?'herd-msg not installed':machine.problem==='upgrade'?'Upgrade herd-remote':'Offline / unavailable','machWarn');
      messageText(section,'p',machine.error,'msgWrap');
      if(machine.problem==='not_installed')messageText(section,'p','Install: make install in the herd-msg checkout, or scripts/deploy.sh "<saved machine label>" from the build machine.','msgWrap');
      continue;
    }
    const s=machine.status;
    messageText(section,'p',s.killed?'Traffic stopped':'Traffic running',s.killed?'danger':'');
    const controls=document.createElement('div');controls.className='msgControls';section.appendChild(controls);
    controls.appendChild(messageButton(s.killed?'Resume':'Stop all traffic',()=>{
      if(confirm(`${s.killed?'Resume':'Stop all'} traffic on ${machine.label}?${s.killed?' Queued mail can run.':''}`))
        messageAct(machine.id,{action:'kill',value:s.killed?'off':'on',confirm:true});
    },!s.killed));
    messageText(section,'p',Object.entries(s.counts||{}).map(([state,n])=>`${state}: ${n}`).join(' · '),'msgCounts');
    for(const h of s.health||[])messageText(section,'p',`${h.check}: ${h.detail}${h.fix?' - '+h.fix:''}`,'machWarn msgWrap');
    const rows=[...(s.pending||[]),...(messageFilter==='all'?(s.recent||[]):[])].filter(m=>
      messageFilter==='all'||(messageFilter==='stuck'?['indeterminate','dead'].includes(m.state):
      messageFilter==='queued'?['queued','claimed','injecting','outbox'].includes(m.state):m.state==='held'));
    if(!rows.length)messageText(section,'div','No messages','empty');
    for(const row of rows){
      const b=document.createElement('button');b.className='card msgRow';b.disabled=messageStale;
      b.onclick=()=>navTo({view:'message',machine:machine.id,id:row.id});
      b.innerHTML=`<span class="age">${escHtml(agoShort(Date.parse(row.created)/1000))}</span>
        <span class="meta"><span class="t">${escHtml(row.first_line||'(empty body)')}</span>
        <span class="s">${escHtml(row.from)} to ${escHtml(row.to)}</span>
        <span class="s">${escHtml(row.created)}${row.error?' · '+escHtml(row.error):''}</span></span>
        <span class="badge">${escHtml(row.state)}</span>`;
      section.appendChild(b);
    }
    const sessions=s.sessions||[];
    if(sessions.length){messageText(section,'h3','Sessions');
      for(const session of sessions.filter(s=>!['offline','dead'].includes(s.state)))paintMessageSession(section,machine,session,false);}
    const offline=sessions.filter(s=>['offline','dead'].includes(s.state));
    if(offline.length){messageText(section,'h3','Offline sessions');for(const session of offline)paintMessageSession(section,machine,session,true);}
  }
}
function paintMessageSession(section,machine,s,offline){
  const row=document.createElement('div');row.className='msgSession';section.appendChild(row);
  messageText(row,'p',`${s.name||s.id} · ${s.harness} · ${s.state}${s.blocked?' · blocked':''} · ${s.unsent} unsent${s.opted_out?' · opted out':''}`,'msgWrap');
  if(s.state==='detached')messageText(row,'p','Relaunch with codex --remote unix:// or without -c. Mail waits.','machWarn');
  if(offline)row.appendChild(messageButton('Clear',()=>{
    if(confirm(`Clear ${s.name||s.id} on ${machine.label}? Drop ${s.unsent} unsent messages. The herdr pane stays open.`))
      messageAct(machine.id,{action:'prune',id:s.id,unsent:s.unsent,confirm:true});
  },true));
  else row.appendChild(messageButton(s.opted_out?'Allow messages':'Opt out',()=>{
    if(confirm(`${s.opted_out?'Allow messages for':'Stop messages to'} ${s.name||s.id}?`))
      messageAct(machine.id,{action:'allow',id:s.id,value:s.opted_out?'on':'off',confirm:true});
  }));
}
function renderMessageDetail(st){stopPoll();show('messageDetailView');$('messageBody').textContent='Loading…';
  $('messageEnvelope').textContent='';$('messageAttempts').textContent='';$('messageHistory').textContent='';$('messageActions').replaceChildren();
  startMessagePoll();}
async function loadMessageDetail(epoch){
  const st=history.state;if(st?.view!=='message')return;
  try{
    const m=await api(messageURL(st.machine,st.id));if(epoch!==messageEpoch)return;
    $('messageTitle').textContent=m.state||'Message';$('messageBody').textContent=m.body||'';
    $('messageEnvelope').textContent=m.envelope||`From: ${m.sender}\nTo: ${m.recipient}@${m.destination}\nID: ${m.id}\nOrigin: ${m.origin}\nHop: ${m.hop}\nCreated: ${m.created}`;
    $('messageAttempts').textContent=JSON.stringify(m.attempts||[],null,2);
    $('messageHistory').textContent=JSON.stringify(m.history||[],null,2);
    $('messageError').textContent=m.error||'';
    const actions=$('messageActions');actions.replaceChildren();
    if(m.state==='held')actions.appendChild(messageButton('Release',()=>messageAct(st.machine,{action:'release',id:m.id})));
    if(['indeterminate','dead'].includes(m.state)){
      actions.appendChild(messageButton('Resend',()=>{
        if(confirm('Resend this message? It may run twice.'))messageAct(st.machine,{action:'resolve',id:m.id,value:'resend',updated:m.updated,confirm:true});
      }));
      actions.appendChild(messageButton('Drop',()=>{
        if(confirm('Drop this message? It will no longer be delivered.'))messageAct(st.machine,{action:'resolve',id:m.id,value:'drop',updated:m.updated,confirm:true});
      },true));
    }
  }catch(e){if(epoch!==messageEpoch||e.message==='unauth')return;
    toast(e.message);$('messageActions').replaceChildren();
    if(e.status===404){
      toast('Message is gone. Refreshing the list.');history.replaceState({view:'messages'},'');renderMessages();
    }else{$('messageError').textContent='Could not refresh: '+e.message;}
  }
}
async function messageAct(machine,body){
  stopMessagePoll();messageStale=true;paintMessages();for(const b of $('messageActions').children)b.disabled=true;
  try{await api(messageURL(machine,'action'),{method:'POST',body:JSON.stringify(body)});toast('Updated');}
  catch(e){if(e.message!=='unauth')toast(e.message);}
  finally{if(['messages','message'].includes(history.state?.view)&&$('login').classList.contains('hidden'))startMessagePoll();}
}

// ---------- wake refresh: re-fetch the current view whenever the page returns to the foreground ----------
// Mobile browsers freeze timers on a backgrounded tab, so on resume the screen is stale and the
// first queued fetch can fail. Re-pull the active view's data the moment the page is visible again.
function refreshCurrentView(){
  // A backgrounded tab can be resumed with a read still "in flight" that will never
  // settle. Clear the guard first so the fresh poll below is allowed to run; the stale
  // request's own handler is a no-op once its pane check fails.
  reading=false;
  if(!$('listView').classList.contains('hidden'))refresh();
  else if(!$('detailView').classList.contains('hidden'))readScroll();
  else if(!$('resumeView').classList.contains('hidden'))renderResume();
  else if(!$('messagesView').classList.contains('hidden')||!$('messageDetailView').classList.contains('hidden')){startMessagePoll();}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshCurrentView();});
window.addEventListener('pageshow',refreshCurrentView);
window.addEventListener('focus',refreshCurrentView);

// ---------- boot ----------
async function boot(){
  try{const j=await api('/api/sessions');history.replaceState({view:'list'},'');
    show('listView');renderCards(j.sessions||[],j.machines||[]);refreshMessageBadge();
    if(refreshLoop)clearInterval(refreshLoop);
    refreshLoop=setInterval(()=>{if(!$('listView').classList.contains('hidden'))refresh();},4000);
  }catch(e){if(e.message==='unauth')show('login');}
}
boot();
</script>
